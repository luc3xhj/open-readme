<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>open-readme — GitHub READMEs for agents</title>
    <meta
      name="description"
      content="Choose a complete README design. Edit its content and download Markdown, configuration and local SVG assets."
    />
    <meta name="theme-color" content="#f6f7f9" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css?v=0.4.0" />
  </head>
  <body data-mode="light">
    <header class="masthead">
      <a class="wordmark" href="./"
        >open-readme<span class="brand-dot" aria-hidden="true">.</span></a
      >
      <nav aria-label="Project links">
        <a href="https://github.com/luc3xhj/open-readme/blob/main/skills/open-readme/SKILL.md"
          >Agent skill ↗</a
        >
        <a href="https://github.com/luc3xhj/open-readme">GitHub ↗</a>
      </nav>
    </header>
    <main class="workspace">
      <div class="toolbar">
        <div class="design-control">
          <span class="control-label">README style</span>
          <div id="design-picker" class="segmented" aria-label="README design"></div>
        </div>
        <div class="actions">
          <button id="mode" type="button">Dark</button>
          <button id="narrow" type="button" aria-pressed="false">Narrow</button>
          <button id="edit" type="button">Customize</button>
          <button id="download" type="button" class="primary">Download ↓</button>
        </div>
      </div>
      <section id="document-frame" class="document-frame" aria-label="README preview">
        <div class="filebar"><span>README.md</span><span>GitHub preview</span></div>
        <article id="readme" class="document"></article>
      </section>
      <p id="status" class="status" role="status"></p>
      <footer>
        <span>Every section. One design system.</span>
        <div>
          <a href="https://github.com/luc3xhj/open-readme/blob/main/docs/configuration.md"
            >Configuration</a
          ><a href="https://github.com/luc3xhj/open-readme/blob/main/docs/sections.md"
            >Section guide</a
          >
        </div>
      </footer>
    </main>
    <dialog id="editor" aria-labelledby="editor-title">
      <div class="editor-heading">
        <h1 id="editor-title">Edit README</h1>
        <button id="close-editor" aria-label="Close editor" type="button">×</button>
      </div>
      <div class="editor-tabs" role="tablist" aria-label="Source">
        <button
          data-editor-tab="sections"
          role="tab"
          aria-selected="true"
          aria-controls="sections-panel"
          id="tab-sections"
        >
          Sections</button
        ><button
          data-editor-tab="config"
          role="tab"
          aria-selected="false"
          aria-controls="config-panel"
          id="tab-config"
        >
          Config</button
        ><button
          data-editor-tab="markdown"
          role="tab"
          aria-selected="false"
          aria-controls="markdown-panel"
          id="tab-markdown"
        >
          Markdown
        </button>
      </div>
      <div id="sections-panel" role="tabpanel" aria-labelledby="tab-sections">
        <p class="editor-note">
          Each section has four design variants. Inherit the complete style, or override a section
          below.
        </p>
        <div id="section-controls"></div>
      </div>
      <div id="config-panel" role="tabpanel" aria-labelledby="tab-config">
        <div class="style-controls">
          <label>Accent<input type="color" id="accent" /></label>
          <label
            >Density<select id="density">
              <option value="compact">Compact</option>
              <option value="comfortable">Comfortable</option>
            </select></label
          >
          <label
            >Display font<select id="font">
              <option value="">Design default</option>
              <option value="sans">Sans</option>
              <option value="mono">Mono</option>
              <option value="serif">Serif</option>
            </select></label
          >
        </div>
        <label class="source-label" for="config-source"
          >open-readme.json <span>Edit the content and ordered sections below.</span></label
        >
        <textarea id="config-source" spellcheck="false" aria-describedby="editor-status"></textarea>
      </div>
      <div id="markdown-panel" hidden role="tabpanel" aria-labelledby="tab-markdown">
        <label class="source-label" for="markdown-source">README.md</label
        ><textarea id="markdown-source" readonly spellcheck="false"></textarea>
      </div>
      <p id="editor-status" class="status" role="status"></p>
      <div class="editor-actions">
        <button id="copy-source" type="button">Copy source</button>
        <div>
          <button id="cancel" type="button">Close</button
          ><button id="apply" type="button" class="primary">Apply changes</button>
        </div>
      </div>
    </dialog>
    <script type="module" src="./app.js?v=0.4.0"></script>
  </body>
</html>
